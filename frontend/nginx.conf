# Same origin for the page and A's API, so that cookies work. /internal is deliberately not forwarded.
limit_req_zone $binary_remote_addr zone=auth:1m rate=5r/s;

server {
    listen 3000;
    root /usr/share/nginx/html;

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://service-a:8000;
        proxy_set_header Host $http_host;
    }

    location = /api/stream {
        proxy_pass http://service-a:8000;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://service-a:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
