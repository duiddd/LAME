# Same origin for the page and A's API, so that cookies work. /internal is deliberately not forwarded.
limit_req_zone $binary_remote_addr zone=auth:1m rate=5r/s;

server {
    listen 3000;
    root /usr/share/nginx/html;

    # Resolve service-a when a request arrives, not at startup: nginx would otherwise refuse to
    # start whenever A's container is not up yet. 127.0.0.11 is Docker's internal DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $service_a http://service-a:8000;

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $service_a;
        proxy_set_header Host $http_host;
    }

    location = /api/stream {
        proxy_pass $service_a;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $service_a;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
