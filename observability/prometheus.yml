global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: service-a
    metrics_path: /metrics
    static_configs:
      - targets: ["service-a:8000"]

  - job_name: service-b
    metrics_path: /metrics
    static_configs:
      - targets: ["service-b:11659"]

  - job_name: service-c
    metrics_path: /metrics
    static_configs:
      - targets: ["service-c:8080"]

  - job_name: service-d
    metrics_path: /metrics
    static_configs:
      - targets: ["service-d:8400"]
